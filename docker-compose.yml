services:
  postgres:
    image: postgres:16-alpine
    container_name: payments_postgres
    restart: unless-stopped
    env_file:
      ./.env.postgres
    ports:
      - "6432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - payments_network

volumes:
  postgres_data:

networks:
  payments_network:
    driver: bridge
