[project]
name = "payments-processor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aio-pika>=10.1.1",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "black>=26.10.1",
    "fastapi[standard]>=0.143.2",
    "faststream[rabbit]>=0.5.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.4",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["src/tests"]
norecursedirs = ["files", "files/*"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "aiosqlite>=0.20.0",
]

