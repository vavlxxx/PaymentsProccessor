[project]
name = "payments-processor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "black>=26.10.1",
    "fastapi[standard]>=0.143.2",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.4",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["src/tests"]
norecursedirs = ["files", "files/*"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

